<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Subjects – SmartAttend Admin</title>
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/admin.css" />
    <script src="/static/js/theme.js"></script>
  </head>
  <body>
    <div class="admin-shell">
      <aside class="sidebar">
        <div class="brand" style="padding: 0 var(--space-4) var(--space-4);">SmartAttend</div>
        <nav id="admin-nav" aria-label="Admin navigation"></nav>
      </aside>

      <div>
        <header class="app-header">
          <span class="muted">Signed in as <strong id="admin-name">…</strong></span>
          <div class="toolbar" style="margin: 0;">
            <button type="button" id="theme-toggle" class="btn btn-secondary btn-small">Dark theme</button>
            <button type="button" id="logout-btn" class="btn btn-secondary btn-small">Sign out</button>
          </div>
        </header>

        <main class="main">
          <div class="page-header">
            <h1>Subjects</h1>
          </div>

          <section class="card" style="margin-bottom: var(--space-5);" aria-labelledby="form-title">
            <h2 id="form-title" style="font-size: var(--text-lg); margin-top: 0;">Add a subject</h2>
            <div id="form-error" class="alert alert-error" role="alert" hidden></div>
            <form id="subject-form" novalidate>
              <input type="hidden" id="subject-id" />
              <div class="field">
                <label for="subject-dept">Department</label>
                <select id="subject-dept" required></select>
              </div>
              <div class="field">
                <label for="subject-code">Subject code</label>
                <input id="subject-code" maxlength="20" placeholder="CS501" required />
              </div>
              <div class="field">
                <label for="subject-name">Subject name</label>
                <input id="subject-name" maxlength="150" required />
              </div>
              <div class="field">
                <label for="subject-semester">Semester</label>
                <input id="subject-semester" type="number" min="1" max="12" required />
              </div>
              <div class="toolbar">
                <button type="submit" id="save-btn" class="btn btn-primary">Save</button>
                <button type="button" id="cancel-btn" class="btn btn-secondary" hidden>Cancel edit</button>
              </div>
            </form>
          </section>

          <div class="table-wrap" id="table-box">
            <p class="muted" style="padding: var(--space-4);">Loading…</p>
          </div>
        </main>
      </div>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite"></div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/admin-layout.js"></script>
    <script src="/static/js/toast.js"></script>
    <script src="/static/js/table.js"></script>
    <script src="/static/js/admin-subjects.js"></script>
  </body>
</html>
