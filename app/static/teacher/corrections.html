<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Correction requests – SmartAttend</title>
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/admin.css" />
    <script src="/static/js/theme.js"></script>
  </head>
  <body>
    <header class="app-header">
      <span class="brand">SmartAttend</span>
      <span class="muted">Signed in as <strong id="teacher-name">…</strong></span>
      <div class="toolbar" style="margin: 0;">
        <button type="button" id="theme-toggle" class="btn btn-secondary btn-small">Dark theme</button>
        <button type="button" id="logout-btn" class="btn btn-secondary btn-small">Sign out</button>
      </div>
    </header>

    <main class="main">
      <div class="page-header"><h1>Correction requests</h1></div>
      <p class="muted">Only requests for your own classes appear here. Approving changes the record; rejecting leaves it as it is.</p>
      <div id="page-error" class="alert alert-error" role="alert" hidden></div>
      <div class="table-wrap" id="table-box">
        <p class="muted" style="padding: var(--space-4);">Loading…</p>
      </div>
    </main>

    <div id="toast-region" class="toast-region" aria-live="polite"></div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/toast.js"></script>
    <script src="/static/js/table.js"></script>
    <script src="/static/js/teacher-corrections.js"></script>
  </body>
</html>
